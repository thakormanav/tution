<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;

            background: linear-gradient(135deg, #e0f2fe, #f8fafc, #dbeafe);

            min-height: 100vh;
        }

        /* Heading */
        h2 {
            text-align: center;
            font-size: 38px;
            color: #111827;
            font-family: Cambria, Georgia, serif;

            margin-bottom: 25px;

            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.25);

            animation: headingAnimation 3s ease-in-out infinite alternate;
        }

        @keyframes headingAnimation {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.04);
            }
        }

        /* Form Card */
        form {
            max-width: 600px;
            margin: auto;

            padding: 30px;

            border-radius: 20px;

            background:
                linear-gradient(
                    rgba(255, 255, 255, 0.88),
                    rgba(255, 255, 255, 0.88)
                ),
                url("https://png.pngtree.com/png-clipart/20241004/original/pngtree-teacher-helping-student-with-homework-clipart-illustration-png-image_16196017.png");

            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.18);

            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        /* Labels */
        label {
            display: block;

            margin-bottom: 7px;

            color: #111827;

            font-size: 18px;
            font-weight: bold;

            font-family: Cambria, Georgia, serif;
        }

        /* Input & Select */
        input,
        select {
            width: 100%;

            padding: 13px 14px;

            margin-bottom: 18px;

            border: 2px solid #d1d5db;

            border-radius: 10px;

            background-color: rgba(255, 255, 255, 0.95);

            color: #111827;

            font-size: 16px;

            outline: none;

            transition: 0.3s;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        input:hover,
        select:hover {
            border-color: #60a5fa;
        }

        /* Select */
        select {
            cursor: pointer;
        }

        /* Buttons */
        .button-container {
            display: flex;

            justify-content: center;

            gap: 15px;

            margin-top: 10px;
        }

        .submit,
        .reset {
            width: 130px;

            padding: 12px;

            border: none;

            border-radius: 10px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        /* Submit */
        .submit {
            background: #2563eb;

            color: white;

            box-shadow:
                0 5px 15px rgba(37, 99, 235, 0.3);
        }

        .submit:hover {
            background: #1d4ed8;

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(37, 99, 235, 0.4);
        }

        /* Reset */
        .reset {
            background: #e5e7eb;

            color: #111827;
        }

        .reset:hover {
            background: #d1d5db;

            transform: translateY(-2px);
        }

        /* Success Message */
        #successMessage {
            display: none;

            max-width: 600px;

            margin: 20px auto 0;

            padding: 15px;

            text-align: center;

            border-radius: 10px;

            background: #dcfce7;

            color: #166534;

            font-size: 17px;

            font-weight: bold;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.1);
        }

        /* Mobile */
        @media screen and (max-width: 600px) {

            body {
                padding: 20px 10px;
            }

            h2 {
                font-size: 28px;
            }

            form {
                padding: 22px 18px;

                border-radius: 15px;
            }

            label {
                font-size: 17px;
            }

            input,
            select {
                font-size: 15px;

                padding: 12px;
            }

            .button-container {
                flex-direction: column;
                align-items: center;
            }

            .submit,
            .reset {
                width: 100%;
            }
        }
    </style>
</head>


<body>

    <h2>Registration Form</h2>


    <!-- Registration Form -->
    <form name="submit-to" method="post" autocomplete="on">

        <!-- Name -->
        <label for="name">Name:</label>

        <input
            type="text"
            id="name"
            name="Name"
            placeholder="Enter your name"
            required
        >


        <!-- Email -->
        <label for="email">Email ID:</label>

        <input
            type="email"
            id="email"
            name="Email id"
            placeholder="Enter your email"
            required
        >


        <!-- Mobile -->
        <label for="mobile">Contact No:</label>

        <input
            type="tel"
            id="mobile"
            name="Mobile no"
            placeholder="Enter mobile number"
            pattern="[0-9]{10}"
            maxlength="10"
            required
        >


        <!-- Address -->
        <label for="address">Address:</label>

        <input
            type="text"
            id="address"
            name="Address"
            placeholder="Enter your address"
            required
        >


        <!-- Instagram -->
        <label for="instagram">Instagram:</label>

        <input
            type="text"
            id="instagram"
            name="socia"
            placeholder="Enter Instagram ID"
            required
        >


        <!-- Social Media -->
        <label for="socialMedia">
            Did you find us through social media?
        </label>

        <select
            id="socialMedia"
            name="Gender"
            required
        >

            <option value="">Select option</option>

            <option value="yes">
                Yes
            </option>

            <option value="no">
                No
            </option>

        </select>


        <!-- Course -->
        <label for="course">
            Course:
        </label>

        <select
            id="course"
            name="Cource"
            required
        >

            <option value="">
                Select Course
            </option>

            <option value="CCC">
                CCC
            </option>

            <option value="CMO">
                CMO
            </option>

            <option value="Typing">
                Typing
            </option>

        </select>


        <!-- Buttons -->
        <div class="button-container">

            <input
                type="submit"
                value="Submit"
                class="submit"
            >

            <input
                type="reset"
                value="Reset"
                class="reset"
            >

        </div>

    </form>


    <!-- Success Message -->
    <div id="successMessage">
        ✅ Registration submitted successfully!
    </div>


    <script>

const scriptURL =
    'https://script.google.com/macros/s/AKfycbw5b7dquhldXZ_RenBz7xDrsaL0FXO385J7eKle1vkDrcK5NAx--WXfqE85tvT9HmJX/exec';

const form = document.forms['submit-to'];

const successMessage =
    document.getElementById('successMessage');

const submitButton =
    document.querySelector('.submit');


form.addEventListener('submit', function (e) {

    e.preventDefault();

    // Change button text
    submitButton.value = 'Submitting...';

    submitButton.disabled = true;


    // Send information to Google Sheet
    fetch(scriptURL, {

        method: 'POST',

        body: new FormData(form)

    })

    .then(response => {

        // ⭐ CLEAR ALL INFORMATION AFTER SUBMIT
        form.reset();

        // Show success message
        successMessage.style.display = 'block';

        // Restore button
        submitButton.value = 'Submit';

        submitButton.disabled = false;


        // Hide success message after 4 seconds
        setTimeout(() => {

            successMessage.style.display = 'none';

        }, 4000);

    })

    .catch(error => {

        console.error('Error!', error);

        alert(
            'Something went wrong. Your information was not submitted.'
        );

        submitButton.value = 'Submit';

        submitButton.disabled = false;

    });

});

</script>

</body>

</html>
